name: Scrape

on:
  schedule:
    # 每天 02:00 台灣時間 (UTC+8 = 18:00 UTC 前一天)
    - cron: "0 18 * * *"
  workflow_dispatch: # 手動觸發

concurrency:
  group: scrape
  cancel-in-progress: false # 不中斷進行中的 scrape

jobs:
  scrape:
    name: Run all scrapers → Neon
    runs-on: ubuntu-latest
    timeout-minutes: 90 # bills 實際約需 40+ 分鐘下載 35 頁（上游 API 變慢，放寬並排到最後）

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.5.1"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install deps
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run migrations
        run: uv run alembic upgrade head

      # 立委基本資料（快，243 筆）
      - name: Scrape legislators
        run: uv run python -m scrapers.legislators

      # 院會發言（快，~718 筆）
      - name: Scrape interpellations
        run: uv run python -m scrapers.interpellations

      # 出席紀錄（目前 API 未公開，0 筆，快速完成）
      - name: Scrape attendance
        run: uv run python -m scrapers.attendance

      # 委員會成員（~1,300 筆，第10+11屆）
      - name: Scrape committee memberships
        run: uv run python -m scrapers.committees

      # 委員問政週報（765 筆，第8屆）
      - name: Scrape activity reports
        run: uv run python -m scrapers.activity_reports

      # 法案（慢，目前抓全部屆別共 35 頁、34,000+ 筆後才在本地篩出第10+11屆）
      # 排最後執行：就算這步逾時被取消，前面其他 scraper 的資料仍已寫入
      - name: Scrape bills
        run: uv run python -m scrapers.bills

      - name: Summary
        if: always()
        run: echo "Scrape workflow completed at $(date -u '+%Y-%m-%d %H:%M UTC')"
